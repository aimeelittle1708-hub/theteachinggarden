{% extends "base.html" %}
{% block content %}
<h1 class="fw-bold mb-4">Register</h1>

<form method="post" class="card p-4 shadow-sm" style="max-width: 520px;">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-success w-100">Create account</button>
</form>

<p class="mt-3">
  Already have an account? <a href="/login/">Login</a>
</p>
{% endblock %}
