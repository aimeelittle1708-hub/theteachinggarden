{% extends "base.html" %}
{% block content %}

<h2 class="fw-bold mb-3">Delete Comment</h2>
<p>Are you sure you want to delete this comment?</p>

<div class="border rounded p-3 mb-3">
  {{ comment.content }}
</div>

<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Yes, delete</button>
  <a class="btn btn-outline-secondary ms-2" href="javascript:history.back()">Cancel</a>
</form>

{% endblock %}
