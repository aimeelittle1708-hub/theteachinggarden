{% extends "base.html" %}
{% block content %}

<h1 class="fw-bold mb-3">Delete Post</h1>

<div class="alert alert-warning">
  Are you sure you want to delete "<strong>{{ post.title }}</strong>"?
</div>

<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Yes, delete</button>
  <a class="btn btn-secondary ms-2" href="{% url 'posts' %}">Cancel</a>
</form>

{% endblock %}
